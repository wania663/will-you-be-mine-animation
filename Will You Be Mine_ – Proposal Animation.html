<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will You Be Mine?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Pinyon+Script&display=swap">
<style>
:root{--bg:#1d31a8;--ink:#e9eeff;--glass:rgba(255,255,255,.14);box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:manipulation;-webkit-tap-highlight-color:transparent;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.tx{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;white-space:nowrap;opacity:0;filter:blur(10px);transition:opacity 1.6s ease,filter 1.6s ease;pointer-events:none;font:italic 500 var(--cs,16px)/1.3 "Cormorant Garamond",Georgia,serif;letter-spacing:.1em;text-shadow:0 0 14px rgba(170,195,255,.7)}
.tx.on{opacity:1;filter:blur(0)}
#ttl{position:fixed;left:50%;top:50%;transform:translate(-50%,-47%);display:flex;flex-direction:column;align-items:center;opacity:0;transition:opacity 1.1s;pointer-events:none}
#ttl.show{opacity:1}
.ln{display:block;white-space:nowrap;font:900 var(--ts,90px)/.96 "Playfair Display",Georgia,serif;letter-spacing:-.02em;color:#ecefe2;text-shadow:0 .04em .45em rgba(10,20,90,.35)}
.ch{display:inline-block;opacity:0;transform:translateY(.35em) rotate(var(--r)) scale(.7);filter:blur(16px);transition:opacity 1s,transform 1.2s cubic-bezier(.2,.9,.25,1.1),filter 1s}
.go .ch{opacity:1;transform:none;filter:blur(0)}
#ul{width:62%;height:auto;margin-top:.1em;overflow:visible}
#ul path{fill:none;stroke:url(#gd);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.8s cubic-bezier(.5,0,.2,1) 2.2s;filter:drop-shadow(0 0 6px rgba(255,170,60,.7))}
.go #ul path{stroke-dashoffset:0}
.lb{position:fixed;transform:translate(-50%,-50%);padding:.05em .5em .15em;border-radius:12px;background:rgba(150,180,255,.22);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font:italic 600 var(--ls,30px)/1.1 "Cormorant Garamond",Georgia,serif;color:#ffb7d7;text-shadow:0 0 16px rgba(255,120,170,.8);opacity:0;transition:opacity 1.6s;pointer-events:none}
.lb.on{opacity:1}
#big span{font:400 var(--bs,70px)/1.1 "Pinyon Script","Brush Script MT",cursive;letter-spacing:0;background:linear-gradient(100deg,#ff8fb4,#ffb39c 55%,#ff9cc4);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block;filter:drop-shadow(0 0 10px rgba(255,100,150,.55));padding:0 .15em}
#ul2{position:fixed;transform:translate(-50%,-50%);height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,#ffb347 25%,#ff9a3a 75%,transparent);box-shadow:0 0 14px rgba(255,160,60,.8);opacity:0;transition:opacity 1.6s,width 1.6s;width:0}
#ul2.on{opacity:1}
#open{position:fixed;border:0;border-radius:50%;background:transparent;cursor:pointer;transform:translate(-50%,-50%)}
#open:focus-visible,#rp:focus-visible,#ans button:focus-visible{outline:2px solid #fff;outline-offset:3px}
#rp{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:var(--glass);color:var(--ink);font:18px/1 Georgia,serif;cursor:pointer;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#ans{position:fixed;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center;align-items:center;opacity:0;pointer-events:none;transition:opacity 1.4s}
#ans.on{opacity:1;pointer-events:auto}
#ans button{font:italic 600 20px "Cormorant Garamond",Georgia,serif;letter-spacing:.04em;color:#fff;padding:11px 26px;border-radius:30px;border:1px solid rgba(255,255,255,.45);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
#ans button:first-child{background:linear-gradient(135deg,#ff86a8,#e8386a);border-color:transparent;box-shadow:0 0 24px rgba(255,110,150,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15246f}}
:root[data-theme="dark"]{--bg:#15246f}
</style>
</head>
<body>
<canvas id="c" aria-label="A love-proposal animation: Will you be mine?"></canvas>
<div class="tx" id="eb"></div><div class="tx" id="hint"></div>
<button id="open" aria-label="Open your love letter"></button>
<div class="tx" id="top"></div><div class="tx" id="sub"></div>
<div id="ttl"><span class="ln"></span><span class="ln"></span>
<svg id="ul" viewBox="0 0 400 40" preserveAspectRatio="none"><defs><linearGradient id="gd"><stop offset="0" stop-color="#ffb347" stop-opacity="0"/><stop offset=".22" stop-color="#ffb43c"/><stop offset=".8" stop-color="#ff972c"/><stop offset="1" stop-color="#ffb347" stop-opacity="0"/></linearGradient></defs><path pathLength="1" stroke-width="4" d="M4 32C90 10 240 2 396 14"/><path pathLength="1" stroke-width="1.6" d="M30 37C140 16 270 10 380 20"/></svg></div>
<div class="tx" id="c1"></div><div class="tx" id="c2"></div>
<div class="lb" id="lyou"></div><div class="lb" id="lme"></div>
<div class="tx" id="sm"></div><div class="tx" id="big"><span></span></div><div id="ul2"></div>
<div id="ans"><button id="y1">Yes 💖</button><button id="y2">Always 💞</button></div>
<button id="rp" title="Replay" aria-label="Replay">↻</button>
<script>
/* ===== EDIT THESE ===== */
const CFG={
  eyebrow:"for the one my heart beats for", hint:"touch the heart to open your love letter",
  top:"of all the hearts in all the world…", l1:"Will You", l2:"Be Mine?",
  sub:"I promise, this is only the beginning",
  you:"you", me:"me", cap1:"you & me, under the stars", cap2:"here’s to us, and a love that blooms",
  small:"two wings, one sky", big:"fly with me",
  done:"I knew it. You just made my sky brighter ✨"
};
/* ====================== */
const $=s=>document.querySelector(s),cv=$('#c'),g=cv.getContext('2d'),R=Math.random,TAU=Math.PI*2;
const sm=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
const win=(t,a,b,c,d)=>sm((t-a)/(b-a))*(1-sm((t-c)/(d-c)));
const ob=x=>{x=Math.max(0,Math.min(1,x));return 1+2.70158*Math.pow(x-1,3)+1.70158*Math.pow(x-1,2)};
const on=(el,c)=>el.classList.toggle('on',c);
let W,H,land,Q,Rc,hh,hy,hc,trees=[],CP=[],opened=false,t0=0,lastT=0,nextSS=0,acc1=0,acc2=0,shown=false;

/* ---------- sprites ---------- */
function hpath(x,c,s,y){x.beginPath();x.moveTo(c,y+s*.92);x.bezierCurveTo(c-s*.2,y+s*.72,c-s,y+s*.28,c-s,y-s*.28);x.bezierCurveTo(c-s,y-s*.78,c-s*.5,y-s*.98,c,y-s*.5);x.bezierCurveTo(c+s*.5,y-s*.98,c+s,y-s*.78,c+s,y-s*.28);x.bezierCurveTo(c+s,y+s*.28,c+s*.2,y+s*.72,c,y+s*.92);x.closePath()}
function spr(n,stops){const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),s=n*.46,m=n/2;
 hpath(x,m,s,m);const gr=x.createRadialGradient(m-s*.35,m-s*.45,s*.05,m,m,s*1.3);stops.forEach((v,i)=>gr.addColorStop(i/(stops.length-1),v));
 x.fillStyle=gr;x.shadowColor=stops[stops.length-1];x.shadowBlur=n*.05;x.fill();x.shadowBlur=0;
 x.save();hpath(x,m,s,m);x.clip();let h=x.createRadialGradient(m-s*.45,m-s*.5,0,m-s*.45,m-s*.5,s*.55);h.addColorStop(0,'rgba(255,255,255,.95)');h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.fillRect(0,0,n,n);
 h=x.createRadialGradient(m,m+s*.95,0,m,m+s*.95,s);h.addColorStop(0,'rgba(255,255,255,.3)');h.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=h;x.fillRect(0,0,n,n);x.restore();return c}
const HEART=spr(256,['#ffe0e4','#ff8aa2','#f0476c','#d82a56']);
const GOLD=spr(64,['#fff','#ffe9a0','#ffc23a']);
const PL=[['#fff','#ffd4e6','#ff9ec4'],['#fff','#c8f6f0','#86dfd8'],['#fff','#e1d9ff','#b0a0ff'],['#fff','#ffe6d2','#ffb79e'],['#fff','#ffe0ee','#ffb0d0'],['#fff','#d8f1ff','#9fd3f5']].map(p=>spr(64,p));
const dh=(img,x,y,s,a=1)=>{const d=s*2.17;g.save();g.globalAlpha*=a;g.drawImage(img,x-d/2,y-d/2,d,d);g.restore()};
function glowAt(x,y,r,c,a){const q=g.createRadialGradient(x,y,0,x,y,r);q.addColorStop(0,`rgba(${c},${a})`);q.addColorStop(1,`rgba(${c},0)`);g.fillStyle=q;g.fillRect(x-r,y-r,2*r,2*r)}
const add=(f)=>{g.save();g.globalCompositeOperation='lighter';f();g.restore()};

/* ---------- particles ---------- */
let P=[];
function sp(x,y,o){P.push(Object.assign({x,y,vx:0,vy:0,l:0,ml:2,s:8,c:PL[R()*6|0],g:0,r:0,w:0,a:1,sw:0},o))}
function burst(x,y,n){for(let i=0;i<n;i++){const a=R()*TAU,v=60+R()*280;sp(x,y,{vx:Math.cos(a)*v,vy:Math.sin(a)*v-90,ml:1.6+R()*1.5,s:6+R()*10,g:230,r:R()*TAU,w:(R()-.5)*3,c:R()<.15?GOLD:PL[R()*6|0]})}}
function stepP(dt){P=P.filter(p=>p.l<p.ml);for(const p of P){p.l+=dt;p.vy+=p.g*dt;p.x+=(p.vx+Math.sin(p.l*1.6+p.r)*p.sw)*dt;p.y+=p.vy*dt;if(p.g)p.vx*=.992;p.r+=p.w*dt;
 g.save();g.globalAlpha=p.a*Math.min(1,(1-p.l/p.ml)*3)*Math.min(1,p.l*3);g.translate(p.x,p.y);g.rotate(p.r*.3);const d=p.s*2.17;g.drawImage(p.c,-d/2,-d/2,d,d);g.restore()}}

/* ---------- trees ---------- */
function canopy(){const hs=[];while(hs.length<240){const x=R()*2.7-1.35,y=R()*2.6-1.25,a=x*x+y*y-1;if(a*a*a-x*x*y*y*y<=0){const hx=x*.88,hy2=-y*.88;hs.push({x:hx,y:hy2,s:.075+R()*.06,c:PL[R()*6|0],d:(1.1-hy2)/2.2+R()*.3,ph:R()*TAU,r:(R()-.5)*.9})}}return hs}
function branches(){const seg=[],ins=(x,y)=>{x/=.88;y=-y/.88;const a=x*x+y*y-1;return a*a*a-x*x*y*y*y<=0};
 (function rec(x,y,ang,len,d){if(d>4)return;const x1=x+Math.cos(ang)*len,y1=y+Math.sin(ang)*len;if(d>1&&!ins(x1,y1))return;seg.push({x,y,x1,y1,d});const n=d===0?3:2;for(let i=0;i<n;i++)rec(x1,y1,ang+(i-(n-1)/2)*(.8-d*.1)+(R()-.5)*.35,len*.77,d+1)})(0,.88,-Math.PI/2,.6,0);return seg}
const mkT=(cx,cy)=>({cx,cy,hs:canopy(),sg:branches(),bow:(R()-.5)*.3});
function drawTree(T,u,t){const{cx,cy}=T,r=Rc,tipY=cy+.88*r,gt=sm(u/2.4);
 if(gt>0){const bx=cx+T.bow*r*2.4,by=(H+20+tipY)/2,N=28;g.lineCap='round';g.strokeStyle='#0f1b5e';
  for(let i=0;i<N;i++){const q0=i/N*gt,q1=(i+1)/N*gt,f=(q,a,b,c)=>(1-q)*(1-q)*a+2*(1-q)*q*b+q*q*c;g.lineWidth=r*(.12-.06*(i/N));g.beginPath();g.moveTo(f(q0,cx,bx,cx),f(q0,H+20,by,tipY));g.lineTo(f(q1,cx,bx,cx),f(q1,H+20,by,tipY));g.stroke()}}
 g.strokeStyle='rgba(138,153,235,.85)';
 for(const s of T.sg){const p=sm((u-2.1-s.d*.5)/.55);if(p<=0)continue;g.lineWidth=Math.max(1.4,r*(.055-s.d*.009));g.beginPath();g.moveTo(cx+s.x*r,cy+s.y*r);g.lineTo(cx+(s.x+(s.x1-s.x)*p)*r,cy+(s.y+(s.y1-s.y)*p)*r);g.stroke()}
 T.hs.forEach(h=>{const k=ob((u-3.3-h.d*3.4)/.6);if(k<=0)return;const br=1+.014*Math.sin(t*1.4+h.ph),s=h.s*r*k;g.save();g.translate(cx+h.x*r*br+Math.sin(t*1.1+h.ph)*r*.012,cy+h.y*r*br+Math.cos(t*1.3+h.ph)*r*.01);g.rotate(h.r+Math.sin(t*1.5+h.ph)*.1);g.globalAlpha*=Math.min(1,k)*(.88+.12*Math.sin(t*2.2+h.ph));const d=s*2.17;g.drawImage(h.c,-d/2,-d/2,d,d);g.restore()})}
function rays(k,T){if(k<=0)return;g.save();g.globalAlpha*=k;g.globalCompositeOperation='lighter';const L=Math.hypot(W,H),gr=g.createRadialGradient(hc.x,hc.y,0,hc.x,hc.y,L*.75);gr.addColorStop(0,'rgba(190,212,255,.5)');gr.addColorStop(1,'rgba(190,212,255,0)');g.fillStyle=gr;const n=28;
 for(let i=0;i<n;i++){const a0=.1*Math.PI+i/n*.8*Math.PI+Math.sin(T*.2)*.02;g.beginPath();g.moveTo(hc.x,hc.y);g.arc(hc.x,hc.y,L,a0,a0+.8*Math.PI/n*.5);g.fill()}g.restore()}
function treesScene(T,t,a,dt){g.save();g.globalAlpha=a;const u0=T-9.5;rays(sm((u0-4)/2),T);
 trees.forEach((tr,i)=>drawTree(tr,u0-i*.5,t));
 const k=ob((u0-8.4)/1.1);if(k>0){const s=Q*.1*k*(1+.05*Math.pow(Math.max(0,Math.sin(t*4.5)),2));add(()=>glowAt(hc.x,hc.y,s*4,'255,120,150',.5));dh(HEART,hc.x,hc.y-(1-sm((u0-8.4)/1.2))*22,s)}
 acc1+=dt;if(u0>5&&acc1>.2){acc1=0;const tr=trees[R()*2|0],h=tr.hs[R()*tr.hs.length|0];sp(tr.cx+h.x*Rc,tr.cy+h.y*Rc,{vy:26+R()*30,sw:24,ml:7,s:5+R()*4,r:R()*6,w:(R()-.5),a:.85})}
 g.restore()}

/* ---------- hero ---------- */
function hero(t,a,T){const x=W/2,y=hy+Math.sin(t*1.5)*hh*.06,pu=1+.06*Math.pow(Math.max(0,Math.sin(t*5.2)),3)+.015*Math.sin(t*1.3),op=opened?1+T*.25:1;
 g.save();g.globalAlpha=a;add(()=>{glowAt(x,y,Q*1.3,'200,220,255',.55);glowAt(x,y,hh*3.5,'255,150,190',.3)});dh(HEART,x,y,hh*pu*op);
 acc2+=1/60;if(!opened&&acc2>.45){acc2=0;sp(x+(R()-.5)*hh*2.4,y-hh*1.1,{vy:-34-R()*30,vx:(R()-.5)*34,ml:3.2,s:4+R()*3,c:R()<.55?GOLD:PL[R()*6|0],r:R()*6,w:(R()-.5)})}
 g.restore()}
function bloom(T,tb,x,y){const u=T-tb;if(u<0||u>2.8)return;const r=Math.max(W,H)*.85*(1-Math.pow(1-Math.min(1,u/1.3),3)),a=win(u,0,.4,1,2.8);
 const q=g.createRadialGradient(x,y,r*.5,x,y,r);q.addColorStop(0,`rgba(246,248,255,${.96*a})`);q.addColorStop(.7,`rgba(222,232,255,${.8*a})`);q.addColorStop(1,'rgba(200,215,255,0)');g.fillStyle=q;g.fillRect(0,0,W,H)}

/* ---------- constellation + butterflies ---------- */
const BF=[{c:['#ffe3e6','#ff6a8c'],h:'255,110,140',a:[.9,1.3,.8,1.1],p:[0,1.7],tr:[]},{c:['#ffffff','#b6cbff'],h:'205,220,255',a:[1.1,.7,1.4,.9],p:[2.4,.6],tr:[]}];
const bpos=(b,t)=>[W/2+Q*1.05*(Math.sin(t*.37*b.a[0]+b.p[0])*.8+Math.sin(t*.9*b.a[1])*.25),H/2+Q*.62*(Math.sin(t*.45*b.a[2]+b.p[1])*.8+Math.cos(t*.8*b.a[3])*.3)];
function fly(b,x,y,ang,v,a){const u=Q*.05;g.save();g.translate(x,y);g.globalAlpha=a;add(()=>glowAt(0,0,u*3.8,b.h,.6));g.rotate(ang);const f=.12+.88*Math.abs(Math.sin(v*8+b.p[0]));
 for(const sd of[-1,1]){g.save();g.scale(1,sd*f);for(const[cx,cy,rx,ry,rot]of[[-.1,1.05,.95,.8,-.5],[-.7,.8,.6,.45,.5]]){const gr=g.createRadialGradient(cx*u,cy*u,0,cx*u,cy*u,rx*u);gr.addColorStop(0,b.c[0]);gr.addColorStop(1,b.c[1]);g.fillStyle=gr;g.globalAlpha=a*.92;g.beginPath();g.ellipse(cx*u,cy*u,rx*u,ry*u,rot,0,TAU);g.fill()}g.restore()}
 g.globalAlpha=a;g.strokeStyle='#2b1034';g.lineWidth=u*.3;g.lineCap='round';g.beginPath();g.moveTo(-u*1.1,0);g.lineTo(u*.8,0);g.stroke();g.restore()}
function star(x,y,k,t,i){const tw=.75+.25*Math.sin(t*3+i*1.9);add(()=>glowAt(x,y,Q*.07*k+2,'255,255,255',.5*tw));const L=Q*.024*k*tw+2;g.strokeStyle='rgba(255,255,255,.95)';g.lineWidth=1.2;g.beginPath();g.moveTo(x-L,y);g.lineTo(x+L,y);g.moveTo(x,y-L);g.lineTo(x,y+L);g.stroke();g.fillStyle='#fff';g.beginPath();g.arc(x,y,2.2*k,0,TAU);g.fill()}
let SS=[];
function drawSS(t){SS=SS.filter(s=>t-s.t<s.d+.6);for(const s of SS){const f=(t-s.t)/s.d;for(let j=0;j<16;j++){const q=f-j*.025;if(q<0||q>1)continue;const x=s.x0+(s.x1-s.x0)*q,y=s.y0+(s.y1-s.y0)*q;g.fillStyle=`rgba(255,255,255,${(1-j/16)*Math.min(1,1.3-f)})`;g.beginPath();g.arc(x,y,j?1.3:2.2,0,TAU);g.fill();if(!j)add(()=>glowAt(x,y,18,'255,255,255',.8))}}}
let meetCd=0;
function constScene(T,t,a){const v=T-25.5;g.save();g.globalAlpha=a;g.lineWidth=1.2;g.lineCap='round';const N=CP.length;
 for(let i=0;i<N;i++){const A=CP[i],B=CP[(i+1)%N],p=sm((v-.2-i*.28)/.5);if(p<=0)continue;g.strokeStyle=`rgba(255,255,255,${.62+.2*Math.sin(t*2+i)})`;g.beginPath();g.moveTo(A[0],A[1]);g.lineTo(A[0]+(B[0]-A[0])*p,A[1]+(B[1]-A[1])*p);g.stroke()}
 CP.forEach((p,i)=>{const k=sm((v-i*.28)/.4);if(k>0)star(p[0],p[1],k,t,i)});
 const fa=sm((v-1.5)/1.6);
 if(fa>0){const ps=BF.map(b=>{const[x,y]=bpos(b,v),[x2,y2]=bpos(b,v-.04);b.tr.push({x,y,t:v});while(b.tr.length&&v-b.tr[0].t>2.4)b.tr.shift();return[x,y,Math.atan2(y-y2,x-x2)]});
  BF.forEach((b,k)=>{const tr=b.tr;for(let i=0;i<tr.length;i+=5){const age=v-tr[i].t;g.fillStyle=`rgba(255,255,255,${(1-age/2.4)*.8*fa})`;g.beginPath();g.arc(tr[i].x,tr[i].y,1.4,0,TAU);g.fill()}
   g.strokeStyle='#fff';for(let i=1;i<tr.length;i++){const age=v-tr[i].t;if(age>.75)continue;g.globalAlpha=a*(1-age/.75)*.85*fa;g.lineWidth=(1-age/.75)*2.6;g.beginPath();g.moveTo(tr[i-1].x,tr[i-1].y);g.lineTo(tr[i].x,tr[i].y);g.stroke()}g.globalAlpha=a;
   fly(b,ps[k][0],ps[k][1],ps[k][2],v,a*fa)});
  if(Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1])<Q*.14&&T>meetCd){meetCd=T+3;for(let i=0;i<10;i++){const an=R()*TAU;sp((ps[0][0]+ps[1][0])/2,(ps[0][1]+ps[1][1])/2,{vx:Math.cos(an)*70,vy:Math.sin(an)*70-30,ml:1.8,s:5+R()*5,g:40,r:R()*6,w:1,c:R()<.4?GOLD:PL[R()*6|0]})}}}
 g.restore()}

/* ---------- background ---------- */
const bkh=[...Array(12)].map(()=>({x:R(),y:R(),r:.1+R()*.2,sp:.02+R()*.04,ph:R()*TAU,a:.07+R()*.1}));
const sts=[...Array(90)].map(()=>({x:R(),y:R(),s:.4+R()*1.1,ph:R()*TAU}));
function bg(t,vc){const q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,'#1b2ea4');q.addColorStop(.6,'#2a46c4');q.addColorStop(1,'#3c5fdb');g.fillStyle=q;g.fillRect(0,0,W,H);
 const M=Math.max(W,H);glowAt(W/2,H*.88,M*.55,'125,165,255',.5);
 add(()=>{for(const b of bkh)glowAt(b.x*W+Math.sin(t*b.sp+b.ph)*W*.04,b.y*H+Math.cos(t*b.sp*1.2+b.ph)*H*.03,b.r*M*.5,'165,195,255',b.a*(1+vc*1.5));if(vc>0)glowAt(W/2,H/2,M*.6,'200,200,255',.16*vc)});
 g.fillStyle='#fff';for(const s of sts){g.globalAlpha=.2+.45*Math.abs(Math.sin(t*.8+s.ph));g.beginPath();g.arc(s.x*W,s.y*H,s.s,0,TAU);g.fill()}g.globalAlpha=1;
 const v=g.createRadialGradient(W/2,H/2,M*.3,W/2,H/2,M*.8);v.addColorStop(0,'rgba(5,10,60,0)');v.addColorStop(1,'rgba(5,10,60,.45)');g.fillStyle=v;g.fillRect(0,0,W,H)}

/* ---------- layout ---------- */
const place=(el,x,y)=>{el.style.left=x+'px';el.style.top=y+'px'};
function layout(){const D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);
 land=W>=H*1.05;Q=land?Math.min(W*.26,H*.38):W*.36;Rc=land?Math.min(W*.165,H*.27):W*.27;hh=Math.max(Q*.17,W*.13);hy=H*.5;
 hc=land?{x:W/2,y:H*.2}:{x:W/2,y:H*.5};
 trees=land?[mkT(W*.3,H*.46),mkT(W*.7,H*.46)]:[mkT(W*.34,H*.3),mkT(W*.66,H*.68)];
 const cs=Math.max(13,Math.min(W*.04,H*.03)),bs=land?Q*.22:W*.13,s=document.documentElement.style;
 s.setProperty('--cs',cs+'px');s.setProperty('--ts',Math.min(W*.19,H*.15)+'px');s.setProperty('--ls',cs*1.9+'px');s.setProperty('--bs',bs+'px');
 place($('#eb'),W/2,hy-hh*2.6);place($('#hint'),W/2,hy+hh*2.7);const o=$('#open');o.style.width=o.style.height=hh*4+'px';place(o,W/2,hy);
 place($('#top'),W/2,H/2-Math.min(W*.19,H*.15)*1.55);place($('#sub'),W/2,H/2+Math.min(W*.19,H*.15)*1.8);
 place($('#c1'),W/2,H*.07+cs);place($('#c2'),W/2,H*.93-cs);
 [['#lyou',trees[0]],['#lme',trees[1]]].forEach(([id,tr])=>place($(id),tr.cx+Rc*.9,tr.cy-Rc*.95));
 place($('#sm'),W/2,H/2-Q*.1);place($('#big'),W/2,H/2+Q*.1);place($('#ul2'),W/2,H/2+Q*.1+bs*.52);$('#ul2').dataset.w=Q*.78;
 const k=Q*.36,c=[W/2,H/2-Q*.06];CP=[...Array(14)].map((_,i)=>{const j=(i===0||i===7)?0:(Math.sin(i*12.9)*.07),u=i/14*TAU+j,rr=1+(i?Math.sin(i*7.3)*.05:0);
  return[c[0]+16*Math.pow(Math.sin(u),3)*(Q/16)*rr,c[1]-(13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u)+2.5)*(Q/16)*rr]})}
function text(){$('#eb').textContent=CFG.eyebrow;$('#hint').textContent=CFG.hint;$('#top').textContent=CFG.top;$('#sub').textContent=CFG.sub;$('#c1').textContent=CFG.cap1;$('#c2').textContent=CFG.cap2;$('#lyou').textContent=CFG.you;$('#lme').textContent=CFG.me;$('#sm').textContent='✦ '+CFG.small+' ✦';$('#big span').textContent=CFG.big;
 document.querySelectorAll('#ttl .ln').forEach((el,k)=>{const s=[CFG.l1,CFG.l2][k];el.innerHTML=[...s].map((c,i)=>`<span class="ch" style="--r:${((Math.sin((k*9+i)*5.1))*18).toFixed(1)}deg;transition-delay:${((k*8+i)*.075).toFixed(2)}s">${c===' '?'&nbsp;':c}</span>`).join('')})}

/* ---------- loop ---------- */
const E={eb:$('#eb'),hint:$('#hint'),top:$('#top'),sub:$('#sub'),c1:$('#c1'),c2:$('#c2'),ly:$('#lyou'),lm:$('#lme'),sm:$('#sm'),big:$('#big'),ul2:$('#ul2'),ans:$('#ans'),ttl:$('#ttl'),open:$('#open')};
function frame(now){const dt=Math.min(.05,(now-lastT)/1000);lastT=now;const T=opened?(now-t0)/1000:-1,t=now/1000;
 bg(t,sm((T-24.6)/2));
 const ha=opened?1-sm(T/.9):1;if(ha>0)hero(t,ha,T);
 const ta=win(T,9.3,10.2,23.6,25.4);if(ta>0)treesScene(T,t,ta,dt);
 const ca=sm((T-24.8)/2);if(ca>0)constScene(T,t,ca);
 if(T>=0){add(()=>{const h=win(T,23.2,25,26,29);if(h>0){g.fillStyle=`rgba(205,215,255,${.38*h})`;g.fillRect(0,0,W,H)}})}
 bloom(T,0,W/2,hy);bloom(T,8.5,W/2,H/2);
 if(T>19&&T>nextSS){nextSS=T+4+R()*3;SS.push({t,d:1.8,x0:W*(.08+R()*.2),y0:H*(.07+R()*.1),x1:W*(.7+R()*.25),y1:H*(.1+R()*.15)})}
 if(T>=0)drawSS(t);stepP(dt);
 on(E.eb,!opened);on(E.hint,!opened);E.open.style.display=opened?'none':'block';
 on(E.top,T>=1.2&&T<8.2);on(E.sub,T>=5.4&&T<8.2);E.ttl.classList.toggle('show',T>=1.1&&T<8.3);E.ttl.classList.toggle('go',T>=1.4&&T<8.3);
 on(E.c1,T>=11&&T<23.4);on(E.c2,T>=15.5&&T<23.4);on(E.ly,T>=14&&T<23.4);on(E.lm,T>=14.8&&T<23.4);
 const cn=T>=28.2;on(E.sm,cn);on(E.big,cn);on(E.ul2,cn);E.ul2.style.width=cn?$('#ul2').dataset.w+'px':'0';
 if(T>=37&&!shown){shown=true;E.ans.classList.add('on')}
 requestAnimationFrame(frame)}
function open(){if(opened)return;opened=true;t0=performance.now();burst(W/2,hy,26)}
function replay(){opened=false;shown=false;P=[];SS=[];BF.forEach(b=>b.tr=[]);meetCd=0;nextSS=0;E.ans.classList.remove('on');E.ans.innerHTML='<button id="y1">Yes 💖</button><button id="y2">Always 💞</button>';wire();E.ttl.classList.remove('go','show');trees=land?[mkT(W*.3,H*.46),mkT(W*.7,H*.46)]:[mkT(W*.34,H*.3),mkT(W*.66,H*.68)]}
function yes(e){burst(e.clientX,e.clientY,70);burst(W/2,H/2,70);E.ans.innerHTML=`<span style="font:italic 600 22px/1.3 'Cormorant Garamond',Georgia,serif;color:#fff;text-align:center;padding:0 24px;text-shadow:0 0 14px #ff6f94">${CFG.done}</span>`}
function wire(){$('#y1').onclick=yes;$('#y2').onclick=yes}
addEventListener('resize',()=>{layout()});
cv.addEventListener('pointerdown',e=>{if(opened)burst(e.clientX,e.clientY,14)});
E.open.onclick=open;$('#rp').onclick=replay;wire();
layout();text();requestAnimationFrame(frame);
</script>
